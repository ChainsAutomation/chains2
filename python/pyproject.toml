[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chains-automation"
version = "0.1.0"
description = "Client SDK for the Chains Automation event protocol"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6,<7",
    "jsonschema>=4.23,<5",
    "paho-mqtt>=2.1,<3",
    "redis>=5,<8",
]

[project.optional-dependencies]
rflink = ["pyserial>=3.5,<4"]

[project.scripts]
chains-service = "chains_automation.__main__:console_main"

[tool.setuptools.packages.find]
where = ["src"]
