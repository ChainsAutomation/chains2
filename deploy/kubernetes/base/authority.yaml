apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chains-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chains
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chains
      app.kubernetes.io/component: authority
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chains
        app.kubernetes.io/component: authority
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authority
          image: chains:dev
          imagePullPolicy: IfNotPresent
          args: ["engine", "-config", "/etc/chains/config.json", "-database", "/var/lib/chains/state.sqlite", "-listen", "0.0.0.0:8080"]
          env:
            - name: CHAINS_RULES
              value: /etc/chains/rules.chains
            - name: CHAINS_BUS
              valueFrom:
                secretKeyRef:
                  name: chains-runtime
                  key: CHAINS_BUS
            - name: CHAINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chains-runtime
                  key: CHAINS_TOKEN
          ports:
            - name: operator
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: operator
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: operator
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/chains
              readOnly: true
            - name: state
              mountPath: /var/lib/chains
      volumes:
        - name: config
          configMap:
            name: chains-config
        - name: state
          persistentVolumeClaim:
            claimName: chains-state
---
apiVersion: v1
kind: Service
metadata:
  name: chains
spec:
  selector:
    app.kubernetes.io/name: chains
    app.kubernetes.io/component: authority
  ports:
    - name: operator
      port: 8080
      targetPort: operator
