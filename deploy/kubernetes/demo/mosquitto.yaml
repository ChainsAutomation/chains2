apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chains-demo-mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chains-demo-mosquitto
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.23
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: chains-demo-mosquitto
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector:
    app.kubernetes.io/name: chains-demo-mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
