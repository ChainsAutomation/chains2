services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  authority:
    environment:
      CHAINS_BUS: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  fan:
    environment:
      CHAINS_BUS: redis://redis:6379

  sensor:
    environment:
      CHAINS_BUS: redis://redis:6379

volumes:
  redis-data:
